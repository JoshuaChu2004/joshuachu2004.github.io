<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} - Joshua Chu{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    {% if page.custom_css %}
    <link rel="stylesheet" href="{{ page.custom_css | relative_url }}">
    {% endif %}
    {% if layout.custom_js %}
    <script src="{{ layout.custom_js | relative_url }}"></script>
    {% elsif page.custom_js %}
    <script src="{{ page.custom_js | relative_url }}"></script>
    {% endif %}

</head>

<body>
    <header>
        <div class="header-container" data-pageType="{{ layout.page_type }}" data-layout="{{ page.layout }}" data-custom_js="{{ page.custom_js | default: layout.custom_js }}">
            <nav>
                <div style="display: flex; gap: 12px; align-items: center">
                    <span class="pill">🎮 Joshua Chu</span>
                    <span class="muted" style="font-size: 13px" data-short="Game Dev • Software Engineer • D&D Homebrew">Game Developer • Software Engineer • D&D Homebrew Creator</span>
                </div>
                <div class="links">
                    <a href="/index.html">Home</a>
                    <a href="/index.html#games" data-short="Games">Video Games</a>
                    <a href="/index.html#software">Software</a>
                    <a href="/dnd/">D&D</a>
                    <a href="/index.html#about">About</a>
                    <a href="/index.html#contact">Contact</a>
                </div>
            </nav>
        </div>
        <div class="header-container mobile" data-pageType="{{ layout.page_type }}" data-layout="{{ page.layout }}" data-custom_js="{{ page.custom_js | default: layout.custom_js }}">

            <nav>
                <div class="pill mobile">🎮 Joshua Chu</div>
                <div class="links">
                    <a href="/index.html">Home</a>
                    <a href="/index.html#games" data-short="Games">Video Games</a>
                    <a href="/index.html#software">Software</a>
                    <a href="/dnd/">D&D</a>
                    <a href="/index.html#about">About</a>
                    <a href="/index.html#contact">Contact</a>
                </div>
            </nav>
        </div>
    </header>

    <div id="content-container" class="content-loading">
        {{ content }}
    </div>

    <!-- Back to Top Button -->
    <div id="back-to-top" class="back-to-top" style="display: none;">
        <a href="#content-header">Back to Top</a>
    </div>


</body>
</html>


<script>    

    console.log(document.querySelector('.header-container').dataset.pageType);
    console.log(document.querySelector('.header-container').dataset.layout);

    if (!document.querySelector('.header-container').dataset.custom_js) {
        console.log('Removing content-loading class due to custom_js not being set');
        document.querySelector('#content-container').classList.remove('content-loading');
    }

    if (document.querySelector('#no-playtesters')) {
        document.querySelector('#acknowledgements').style.display = 'none';
    }

    // Back to Top Button Logic
    function toggleBackToTop() {
        const backToTopButton = document.getElementById('back-to-top');
        const windowHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;
        
        // Show button if page height is more than 2 screens worth
        if (documentHeight > windowHeight * 1.25) {
            backToTopButton.style.display = 'block';
        } else {
            backToTopButton.style.display = 'none';
        }
    }

    // Check on page load and resize
    document.addEventListener('DOMContentLoaded', toggleBackToTop);
    window.addEventListener('resize', toggleBackToTop);

    // Toggle notes dropdown
    function toggleNotes(arrowElement) {
        const dropdown = arrowElement.parentElement.querySelector('.notes-dropdown');
        const isVisible = dropdown.style.display !== 'none';
        
        if (isVisible) {
            dropdown.style.display = 'none';
            arrowElement.textContent = '▶';
        } else {
            dropdown.style.display = 'block';
            arrowElement.textContent = '▼';
        }
    }

    
    document.addEventListener('DOMContentLoaded', function() {
        // Auto-load content from data attributes
        loadAllContent();
        const html = document.querySelector('html');
        console.log('Loading content: ' + html.innerHTML);
        html.innerHTML = convertToDivs(extractContentFromHtml(html.innerHTML));
        console.log('Loading content: ' + html.innerHTML);
        document.querySelector('#content-container').classList.remove('content-loading');
    });
</script>
