<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} - Joshua Chu{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    {% if page.custom_css %}
    <link rel="stylesheet" href="{{ page.custom_css | relative_url }}">
    {% endif %}

</head>

<body>
    <header data-pageType="{{ layout.page_type }}" data-layout="{{ page.layout }}" data-custom_js="{{ page.custom_js | default: layout.custom_js }}">
        <nav>
            <div class="navbar-brand">
                <span class="navbar-item">Joshua Chu</span>
            </div>
            <div class="navbar-links">
                <a class="navbar-link" href="">Home</a>
                <a class="navbar-link" href="/#games" data-short="Games">Video Games</a>
                <a class="navbar-link" href="/#software">Software</a>
                <a class="navbar-link" href="/dnd/">D&D</a>
                <a class="navbar-link" href="/#about">About</a>
                <a class="navbar-link" href="/#contact">Contact</a>
            </div>
        </nav>
    </header>
    <header class="mobile" data-pageType="{{ layout.page_type }}" data-layout="{{ page.layout }}" data-custom_js="{{ page.custom_js | default: layout.custom_js }}">
        <nav>
            <div style="display: flex; gap: 12px; align-items: center">
                <span class="pill">🎮 Joshua Chu</span>
                <span class="muted" style="font-size: 13px" data-short="Game Dev • Software Engineer • D&D Homebrew">Game Developer • Software Engineer • D&D Homebrew Creator</span>
            </div>
            <div class="links">
                <a href="/index.html">Home</a>
                <a href="/index.html#games" data-short="Games">Video Games</a>
                <a href="/index.html#software">Software</a>
                <a href="/dnd/">D&D</a>
                <a href="/index.html#about">About</a>
                <a href="/index.html#contact">Contact</a>
            </div>
        </nav>
    </header>

    <div id="content-container" class="content-loading">
        {{ content }}
    </div>
</body>
</html>
